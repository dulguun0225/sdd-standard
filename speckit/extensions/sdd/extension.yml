schema_version: "1.0"

extension:
  id: sdd
  name: "SDD Review Phase"
  version: "0.3.0"
  description: "The SDD review phase: agent self-review — checks the implementation against spec/plan/tasks, including silence-conformance against the profile's stated-or-default contract reading, and writes the findings to review-notes.md; findings are resolved before the item is done"
  category: "process"
  effect: "read-write"
  author: "sdd-standard maintainers"
  repository: "https://example.com/sdd-standard"
  license: "MIT"

requires:
  speckit_version: ">=0.12.3,<0.14.0"

provides:
  commands:
    - name: speckit.sdd.review
      file: commands/review.md
      description: "Compare the implementation with the spec, plan, and tasks; write the findings to review-notes.md"

hooks:
  after_implement:
    command: speckit.sdd.review
    optional: false
    description: "The review phase runs after implementation completes, before the item is marked done (SDD-STANDARD §3.1)"

tags:
  - "sdd"
  - "review"
  - "process"
