schema_version: "1.0"

preset:
  id: "sdd"
  name: "SDD Standard"
  version: "0.4.0"
  description: "The SDD convention over stock Spec Kit: Requirements/Design/Tasks vocabulary, EARS with stable R-ids, [R-n] traceability, profile contract slots"
  author: "sdd-standard maintainers"
  repository: "https://example.com/sdd-standard"
  license: "MIT"

requires:
  speckit_version: ">=0.12.3,<0.14.0"

# Template overrides only — no command or script overrides: touch only
# supported upstream override points; that is what keeps pin-forwards cheap.
provides:
  templates:
    - type: "template"
      name: "constitution-template"
      file: "templates/constitution-template.md"
      description: "Shared constitution: the non-negotiable principles every adopting repo inherits"
      replaces: "constitution-template"

    - type: "template"
      name: "spec-template"
      file: "templates/spec-template.md"
      description: "Requirements Document: EARS requirements with stable R-ids"
      replaces: "spec-template"

    - type: "template"
      name: "plan-template"
      file: "templates/plan-template.md"
      description: "Design Document: architecture plus the two contract sections a stack profile fills"
      replaces: "plan-template"

    # Full replace, not an append addendum: at v0.13.0 the scaffolded
    # workflow scripts apply manifest-declared composition strategies only
    # when a working python3 + PyYAML are present at scaffold time, and
    # degrade to path-convention replace-only resolution without them
    # (common.sh resolve_template fallback paths). All-replace is the one
    # policy that behaves identically at every degradation level.
    - type: "template"
      name: "tasks-template"
      file: "templates/tasks-template.md"
      description: "Task List: every task carries [R-n] traceability"
      replaces: "tasks-template"

tags:
  - "sdd"
  - "convention"
